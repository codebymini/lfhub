name: Warn PR targets main

on:
  pull_request_target:
    types: [opened, edited]
    branches: [main]

jobs:
  warn:
    if: ${{ !github.event.repository.fork && !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comment on PR
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'This PR targets `main`, which only takes releases. Please retarget it to `dev`.'
            });
