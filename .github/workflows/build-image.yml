name: Build and Push lfhub Image

# The image is built by the .NET SDK (`/t:PublishContainer`) for linux-x64 and
# linux-arm64 and pushed to ghcr.io/<owner>/<repository>: main as `latest`, dev as
# `dev`, each also under its commit's SHA. A manual run on another branch runs the
# tests alone.
#
# Versions: `<Version>` in lfhub.csproj is MAJOR.MINOR.PATCH. A release on main is
# X.Y.0 (set by release.sh); every push to dev raises PATCH by one in a commit of its
# own ("CI: Bump dev version to X.Y.Z [skip ci]"), and the dev image is built from
# that commit, so the version a hub reports matches lfhub.csproj on its branch. A push
# that sets the version itself (a release sync) is built as it is. Forks build without
# bumping. The bump pushes with the LFHUB_TOKEN_AUTOBUMP secret when it exists (needed
# once dev is protected), otherwise with the workflow's token.

on:
  push:
    branches: [main, dev]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build lfhub.slnx -c Release

      - name: Check formatting
        run: dotnet format lfhub.slnx --verify-no-changes --no-restore

      - name: Test
        env:
          LFHUB_TEST_DATABASE: Host=localhost;Port=5432;Username=postgres
        run: dotnet test --solution lfhub.slnx -c Release --no-build

  bump-version:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && !github.event.repository.fork
    runs-on: ubuntu-latest
    concurrency:
      group: bump-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}

    steps:
      - name: Check out dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.LFHUB_TOKEN_AUTOBUMP || github.token }}

      - name: Bump the patch version
        id: bump
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] &&
             git diff "$BEFORE..${GITHUB_SHA}" -- lfhub.csproj | grep -qE '^\+ *<Version>'; then
            echo "The version was set in this push; building it as it is."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(sed -nE 's|^ *<Version>([0-9]+\.[0-9]+\.[0-9]+)</Version>.*|\1|p' lfhub.csproj)
          if [ -z "$CURRENT" ]; then
            echo "::error::No <Version>MAJOR.MINOR.PATCH</Version> in lfhub.csproj"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i -E "s|<Version>${CURRENT//./\\.}</Version>|<Version>$NEW</Version>|" lfhub.csproj
          echo "Version: $CURRENT -> $NEW"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "CI: Bump dev version to $NEW [skip ci]" lfhub.csproj
          git push origin HEAD:dev
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: [test, bump-version]
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.bump-version.result != 'failure' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.workflow }}
      cancel-in-progress: false

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-version.outputs.sha || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          REPOSITORY: ${{ github.repository }}
          CHANNEL: ${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}
        run: >
          dotnet publish lfhub.csproj -c Release --self-contained false
          /t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=${REPOSITORY,,}
          -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}
          -p:HubChannel=${CHANNEL}
          "-p:ContainerImageTags=\"${CHANNEL};$(git rev-parse HEAD)\""
